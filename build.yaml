# Debug-only build: right-hand PMW3610 trackball with USB serial logging of
# raw sensor samples (x/y, surface quality, shutter). Not for daily use.
include:
  - board: bmp_boost
    shield: zen_right
    snippet: "zmk-usb-logging split-central input-trackball-pmw3610 input-listener input-split-listener-left-all"
    artifact-name: zen_right_trackball_pmw3610_central_DEBUG_LOG
